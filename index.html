<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yamen's Hub — مركز يامن الدراسي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="assets/theme.css?v=4">
<script>(function(){var t="dark";try{t=localStorage.getItem("yh-theme")||"dark"}catch(e){}document.documentElement.setAttribute("data-theme",t)})();</script>
<style>
:root{--card:var(--surface);--sunk:var(--surface-2);--ink2:var(--ink-2);--accent:var(--gold);--accent-soft:var(--gold-soft);--accent-ink:var(--gold-2);--red:var(--bad);--red-soft:var(--bad-soft);--amber:var(--warn);--amber-soft:var(--warn-soft)}
 *{box-sizing:border-box}
body{font-size:17px}
bdi{unicode-bidi:isolate}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 80px}

header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;
  border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:18px}
header h1{font-size:1.5rem;margin:0;font-weight:700}
header .who{color:var(--muted);font-size:.87rem}

nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
nav button{font-family:inherit;font-size:.92rem;font-weight:600;cursor:pointer;
  background:var(--card);color:var(--ink2);border:1px solid var(--line);
  padding:8px 16px;border-radius:999px;transition:.15s}
nav button:hover{border-color:var(--accent)}
nav button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
section[hidden]{display:none}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:1.05rem}
.lbl{font-size:.7rem;letter-spacing:.1em;font-weight:700;color:var(--muted)}

/* today */
.slot{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.slot .t{font-family:"IBM Plex Mono",monospace;font-size:.86rem;color:var(--muted);
  min-width:96px;unicode-bidi:isolate;direction:ltr;text-align:start}
.slot .c{font-weight:600}
.slot .r{margin-inline-start:auto;font-size:.78rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.empty{color:var(--muted);font-size:.92rem;padding:8px 0}

/* countdown */
.cd{display:flex;gap:10px;flex-wrap:wrap}
.cd .item{flex:1;min-width:150px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--card)}
.cd .n{font-family:"IBM Plex Mono",monospace;font-size:1.5rem;font-weight:600;line-height:1.2}
.cd .item.soon{border-color:var(--red)} .cd .item.soon .n{color:var(--red)}
.cd .item.mid{border-color:var(--amber)} .cd .item.mid .n{color:var(--amber)}
.cd .k{font-size:.82rem;color:var(--ink2);margin-top:2px}
.cd .w{font-size:.74rem;color:var(--muted)}

/* week grid */
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;min-width:640px}
.wcol{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:120px}
.wcol h3{margin:0 0 8px;font-size:.85rem;text-align:center;color:var(--muted);font-weight:700}
.wcol.today{border-color:var(--accent);border-width:2px}
.ev{border-radius:7px;padding:7px 8px;margin-bottom:6px;color:#fff;font-size:.8rem;line-height:1.45}
.ev b{display:block;font-family:"IBM Plex Mono",monospace;font-size:.82rem}
.ev span{opacity:.9;font-size:.74rem}
.scroll{overflow-x:auto;padding-bottom:6px}

/* calendar */
.mon{margin-bottom:26px}
.mon h3{margin:0 0 8px;font-size:1.02rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .hd{text-align:center;font-size:.72rem;font-weight:700;color:var(--muted);padding:4px 0}
.cal .d{background:var(--card);border:1px solid var(--line);border-radius:6px;
  min-height:64px;padding:4px 5px;font-size:.75rem;position:relative}
.cal .d.out{background:transparent;border-color:transparent}
.cal .d .num{font-family:"IBM Plex Mono",monospace;font-size:.76rem;color:var(--muted)}
.cal .d.today{border-color:var(--accent);border-width:2px}
.cal .d.today .num{color:var(--accent);font-weight:700}
.cal .d.hol{background:var(--amber-soft)}
.cal .d.hol .num{color:var(--amber)}
.chip{display:block;border-radius:3px;margin-top:2px;padding:1px 4px;font-size:.63rem;
  color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.dl{background:var(--red);font-weight:600}
.chip.holn{background:transparent;color:var(--amber);font-weight:600;padding-inline:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:10px 0 18px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}

/* courses */
.course{border-inline-start:5px solid var(--line);background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.course .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.course .code{font-family:"IBM Plex Mono",monospace;font-weight:600}
.course .ar{font-weight:600}
.course .meta{font-size:.82rem;color:var(--muted);margin-top:4px}
.course .note{font-size:.85rem;color:var(--ink2);margin-top:8px;
  background:var(--accent-soft);border-radius:6px;padding:8px 10px}
.tag{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;
  background:var(--red-soft);color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:8px}
th{background:var(--accent-soft);text-align:start;padding:8px 10px;border:1px solid var(--line);font-size:.8rem}
td{padding:8px 10px;border:1px solid var(--line)}
.warn{background:var(--amber-soft);border-inline-start:4px solid var(--amber);
  padding:10px 14px;border-radius:0 8px 8px 0;font-size:.88rem;color:var(--ink2);margin-top:10px}
a.lesson{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;margin-bottom:8px;text-decoration:none;color:inherit}
a.lesson:hover{border-color:var(--accent)}
a.lesson .t{font-weight:600}
a.lesson .s{font-size:.8rem;color:var(--muted)}
.soonlbl{font-size:.72rem;color:var(--muted);margin-top:2px}
.pend{opacity:.55}
/* summaries grouped by course > chapter */
.ncourse{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
.ncourse>.h{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px}
.ncourse>.h .code{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:1.02rem}
.ncourse>.h .ar{font-weight:600}
.ncourse>.h .cnt{margin-inline-start:auto;font-size:.76rem;color:var(--muted);
  font-family:"IBM Plex Mono",monospace;white-space:nowrap}
.nchap{margin-top:14px}
.nchap>.ct{font-weight:600;font-size:.9rem;padding-bottom:6px;border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.nchap>.ct .cm{font-size:.76rem;color:var(--muted);font-weight:400}
.nitem{display:flex;gap:11px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid var(--line)}
.nitem:last-child{border-bottom:0}
.nitem .num{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;
  font-family:"IBM Plex Mono",monospace;font-size:.72rem;font-weight:700;color:#fff;margin-top:2px}
.num.done{background:var(--accent)} .num.soon{background:var(--amber)}
.num.src{background:#1b5e9c} .num.wait{background:var(--muted)}
.nitem .bd{flex:1;min-width:0}
.nitem .t1{font-weight:600;font-size:.95rem}
.nitem a.t1{color:var(--accent);text-decoration:none}
.nitem a.t1:hover{text-decoration:underline}
.nitem .t2{font-size:.79rem;color:var(--muted);direction:ltr;unicode-bidi:isolate;display:inline-block}
.nitem .ob{font-family:"IBM Plex Mono",monospace;font-size:.7rem;color:var(--muted);
  border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-inline-start:6px}
.nitem .nn{font-size:.79rem;color:var(--muted);margin-top:2px;line-height:1.55}
.nitem .sr{display:inline-block;font-size:.68rem;font-weight:700;color:#fff;background:var(--red);
  border-radius:999px;padding:1px 8px;margin-inline-start:6px}
.nitem.off{opacity:.62}
.enlink{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:.66rem;font-weight:700;color:#fff;background:#1b5e9c;border-radius:4px;padding:1px 6px;margin-inline-start:6px;text-decoration:none;vertical-align:2px}
.enlink:hover{background:#14486f}


/* map + method */
.tree{font-size:.92rem}
.tnode{border-inline-start:2px solid var(--line);margin-inline-start:8px;padding-inline-start:16px}
.tcourse{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:14px 16px;margin-bottom:14px}
.tcourse>.h{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px;margin-bottom:4px}
.tcourse>.h .code{font-family:"IBM Plex Mono",monospace;font-weight:700}
.tcourse .book{font-size:.78rem;color:var(--muted);margin-bottom:10px}
.tunit{font-weight:600;font-size:.88rem;margin:10px 0 4px;color:var(--ink2)}
.titem{display:flex;gap:9px;align-items:flex-start;padding:5px 0}
.titem .st{flex:none;width:19px;height:19px;border-radius:5px;display:grid;place-items:center;
  font-size:.66rem;font-weight:700;color:#fff;margin-top:3px}
.st.done{background:var(--accent)} .st.todo{background:var(--amber)}
.st.wait{background:var(--muted)} .st.block{background:var(--red)} .st.ready{background:#1b5e9c}
.titem .tx{flex:1;min-width:0}
.titem .tt{font-weight:500}
.titem a.tt{color:var(--accent);text-decoration:none}
.titem a.tt:hover{text-decoration:underline}
.titem .obj{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--muted);
  border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-inline-start:6px}
.titem .nt{font-size:.79rem;color:var(--muted);line-height:1.55}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:4px 0 4px}
.key span{display:flex;align-items:center;gap:6px}
.blocks{display:grid;gap:8px;margin:12px 0}
.brow{display:grid;grid-template-columns:78px 1fr;gap:12px;align-items:start;
  background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.brow .bn{font-family:"IBM Plex Mono",monospace;font-size:.72rem;font-weight:700;
  color:#fff;background:var(--accent);border-radius:4px;text-align:center;padding:3px 0}
.brow .bn.en{background:var(--red)}
.brow .bd{font-size:.87rem;line-height:1.6}
.brow .bd b{color:var(--accent)}
.samp{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;
  margin:12px 0;font-size:.9rem;line-height:1.75}
.samp .en{direction:ltr;text-align:left;background:var(--accent-soft);border-radius:6px;
  padding:10px 12px;margin-top:10px;font-weight:600}

</style>
</head>
<body>
<div class="wrap">

<header>
  <h1><bdi>Yamen's Hub</bdi></h1>
  <span class="who" id="who"></span>
  <button class="tbtn theme" aria-label="theme" style="margin-inline-start:auto">🌙</button>
</header>

<nav id="nav">
  <button data-t="today"  aria-selected="true">اليوم</button>
  <button data-t="week"   aria-selected="false">الأسبوع</button>
  <button data-t="cal"    aria-selected="false">التقويم</button>
  <button data-t="courses"aria-selected="false">المواد</button>
  <button data-t="notes"  aria-selected="false">الملخصات</button>
  <button data-t="map"    aria-selected="false">الخريطة</button>
  <button data-t="decks"  aria-selected="false">🃏 البطاقات</button>
</nav>

<section id="today"></section>
<section id="week" hidden></section>
<section id="cal" hidden></section>
<section id="courses" hidden></section>
<section id="notes" hidden></section>
<section id="map" hidden></section>
<section id="decks" hidden></section>

</div>

<script src="data.js"></script>
<script src="data/cards-S1.js?v=4"></script>
<script src="data/cards-S2.js?v=4"></script>
<script src="data/cards-S3.js?v=4"></script>
<script src="data/cards-S4.js?v=4"></script>
<script src="data/cards-M1.js?v=4"></script>
<script src="data/cards-M2.js?v=4"></script>
<script src="data/cards-M3.js?v=4"></script>
<script src="data/cards-M4.js?v=4"></script>
<script src="assets/flashcards.js?v=4"></script>
<script src="assets/lesson.js?v=4"></script>
<script>
const DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const DNAMES=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"];
const MONTHS={1:"يناير",2:"فبراير",3:"مارس",4:"أبريل",5:"مايو",6:"يونيو",7:"يوليو",
  8:"أغسطس",9:"سبتمبر",10:"أكتوبر",11:"نوفمبر",12:"ديسمبر"};
const C={}; COURSES.forEach(c=>C[c.code]=c);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=new Date(); const TODAY=iso(today);
const dayDiff=(a,b)=>Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5);
const inHol=s=>HOLIDAYS.find(h=>s>=h.from&&s<=h.to);

document.getElementById("who").textContent =
  STUDENT.name+" · "+STUDENT.term+" · "+STUDENT.credits+" ساعة معتمدة";

/* ---------- اليوم ---------- */
function renderToday(){
  const dow=today.getDay(); const h=inHol(TODAY);
  let s='<div class="grid g2">';
  s+='<div class="card"><span class="lbl">اليوم — '+DAYS[dow]+' '+TODAY+'</span><h2 style="margin-top:6px">محاضراتك</h2>';
  if(h){ s+='<div class="empty">🎉 '+h.name+' — ما فيه محاضرات</div>'; }
  else if(dow>4){ s+='<div class="empty">نهاية الأسبوع — ما فيه محاضرات</div>'; }
  else{
    const list=SCHEDULE.filter(x=>x.day===dow).sort((a,b)=>a.from.localeCompare(b.from));
    if(!list.length) s+='<div class="empty">ما فيه محاضرات اليوم</div>';
    list.forEach(x=>{const c=C[x.code];
      s+='<div class="slot"><span class="dot" style="background:'+c.color+'"></span>'+
         '<span class="t">'+x.from+'–'+x.to+'</span>'+
         '<span class="c"><bdi>'+c.code+'</bdi> — '+c.ar+'</span>'+
         '<span class="r">'+c.room+'</span></div>';});
  }
  s+='</div>';

  const up=DEADLINES.map(d=>({...d,left:dayDiff(TODAY,d.date)}))
      .filter(d=>d.left>=0).sort((a,b)=>a.left-b.left);
  s+='<div class="card"><span class="lbl">القادم</span><h2 style="margin-top:6px">أقرب المواعيد</h2><div class="cd">';
  if(!up.length) s+='<div class="empty">ما فيه مواعيد قادمة مسجّلة</div>';
  up.slice(0,4).forEach(d=>{
    const cls=d.left<=7?"soon":(d.left<=21?"mid":"");
    s+='<div class="item '+cls+'"><div class="n">'+d.left+'</div>'+
       '<div class="w">يوم متبقٍ</div><div class="k"><bdi>'+d.code+'</bdi> — '+d.title+
       (d.weight?' <b>('+d.weight+'%)</b>':'')+'</div></div>';});
  s+='</div></div></div>';
  document.getElementById("today").innerHTML=s;
}

/* ---------- الأسبوع ---------- */
function renderWeek(){
  let s='<div class="card"><h2>الجدول الأسبوعي</h2><div class="scroll"><div class="week">';
  for(let d=0;d<5;d++){
    s+='<div class="wcol'+(d===today.getDay()?' today':'')+'"><h3>'+DNAMES[d]+'</h3>';
    SCHEDULE.filter(x=>x.day===d).sort((a,b)=>a.from.localeCompare(b.from)).forEach(x=>{
      const c=C[x.code];
      s+='<div class="ev" style="background:'+c.color+'"><b>'+c.code+'</b>'+
         '<span>'+x.from+'–'+x.to+'<br>'+(c.online?'أونلاين':c.room)+'</span></div>';});
    s+='</div>';
  }
  s+='</div></div></div>';
  s+='<div class="card" style="margin-top:14px"><h2>خطة سلوك المستهلك أسبوعياً</h2><table>'+
     '<tr><th>الأسبوع</th><th>يبدأ</th><th>الموضوع</th></tr>';
  MKT231_WEEKS.forEach(w=>{
    const cur = TODAY>=w[1] && dayDiff(w[1],TODAY)<7;
    s+='<tr'+(cur?' style="background:var(--accent-soft);font-weight:600"':'')+
       '><td class="mono">'+w[0]+'</td><td class="mono">'+w[1]+'</td><td>'+w[2]+'</td></tr>';});
  s+='</table></div>';
  document.getElementById("week").innerHTML=s;
}

/* ---------- التقويم ---------- */
function renderCal(){
  let s='<div class="legend">'+
    '<span><i style="background:var(--red)"></i>موعد مهم</span>'+
    '<span><i style="background:var(--amber-soft);border:1px solid var(--amber)"></i>إجازة</span>'+
    '<span><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i>اليوم</span>'+
    '<span>النقاط الملوّنة = محاضرات</span></div>';

  TERM.months.forEach(ym=>{
    const [Y,M]=ym.split("-").map(Number);
    const first=new Date(Y,M-1,1), last=new Date(Y,M,0);
    s+='<div class="mon"><h3>'+MONTHS[M]+' '+Y+'</h3><div class="cal">';
    ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"]
      .forEach(d=>s+='<div class="hd">'+d+'</div>');
    for(let i=0;i<first.getDay();i++) s+='<div class="d out"></div>';
    for(let day=1;day<=last.getDate();day++){
      const dt=new Date(Y,M-1,day), ds=iso(dt), dow=dt.getDay();
      const hol=inHol(ds), isToday=ds===TODAY;
      const inTerm = ds>=TERM.start && ds<=TERM.end;
      let cls="d"+(isToday?" today":"")+(hol?" hol":"");
      s+='<div class="'+cls+'"><span class="num">'+day+'</span>';
      if(hol && (day===dt.getDate() && (ds===hol.from)))
        s+='<span class="chip holn">'+hol.name+'</span>';
      if(!hol && inTerm && dow<5){
        const lec=SCHEDULE.filter(x=>x.day===dow);
        if(lec.length){ s+='<div style="margin-top:3px">';
          lec.forEach(x=>s+='<span style="display:inline-block;width:7px;height:7px;border-radius:50%;'+
            'margin-inline-end:3px;background:'+C[x.code].color+'" title="'+x.code+' '+x.from+'"></span>');
          s+='</div>'; }
      }
      DEADLINES.filter(d=>d.date===ds).forEach(d=>{
        s+='<span class="chip dl" title="'+(d.note||"")+'">'+
           (d.code!=="—"?d.code+" · ":"")+d.title+'</span>';});
      s+='</div>';
    }
    s+='</div></div>';
  });

  s+='<div class="card"><h2>كل المواعيد</h2><table><tr><th>التاريخ</th><th>المادة</th><th>الموعد</th><th>الوزن</th><th>ملاحظة</th></tr>';
  DEADLINES.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(d=>{
    const left=dayDiff(TODAY,d.date);
    s+='<tr'+(left<0?' class="pend"':'')+'><td class="mono">'+d.date+'</td>'+
       '<td class="mono">'+d.code+'</td><td>'+d.title+
       (left>=0?'<div class="soonlbl">باقي '+left+' يوم</div>':'')+'</td>'+
       '<td class="mono">'+(d.weight?d.weight+'%':'—')+'</td>'+
       '<td style="font-size:.82rem;color:var(--muted)">'+(d.note||"")+'</td></tr>';});
  s+='</table></div>';
  document.getElementById("cal").innerHTML=s;
}

/* ---------- المواد ---------- */
function renderCourses(){
  let s='<div class="grid">';
  COURSES.forEach(c=>{
    s+='<div class="course" style="border-inline-start-color:'+c.color+'">'+
       '<div class="top"><span class="code">'+c.code+'</span>'+
       '<span class="ar">'+c.ar+'</span>'+
       (c.retake?'<span class="tag">إعادة — الأولوية</span>':'')+'</div>'+
       '<div class="meta"><bdi>'+c.en+'</bdi> · شعبة '+c.sec+' · '+c.cr+' ساعات · '+
       c.teacher+' · '+c.room+(c.lang!=="—"?' · لغة التدريس: '+c.lang:'')+'</div>';
    const g=GRADING[c.code];
    if(g&&g.confirmed){
      s+='<table><tr><th>البند</th><th>الوزن</th><th>التوقيت</th></tr>';
      g.items.forEach(i=>s+='<tr><td>'+i.ar+(i.attend?' <span style="color:var(--amber)">(حضور)</span>':'')+
        '</td><td class="mono"><b>'+i.w+'%</b></td><td>'+i.when+'</td></tr>');
      s+='</table><div class="warn">١٥٪ من الدرجة (مشاركة + ملاحظة مباشرة) ما تنكسب إلا بالحضور. '+
         'و٥٠٪ تتحدد قبل الاختبار النهائي.</div>';
    } else {
      s+='<div class="warn">⚠ توزيع الدرجات غير معروف — لازم تجيب <b>دليل المقرر</b> من الدكتور. '+
         'بدونه ما نقدر نحسب وين درجتك رايحة.</div>';
    }
    if(c.note) s+='<div class="note">'+c.note+'</div>';
    s+='</div>';
  });
  s+='</div><div class="card" style="margin-top:14px"><h2>الغياب والحرمان</h2>'+
     '<div class="warn">تجاوز <b>٢٥٪</b> من محاضرات أي مادة = <b>حرمان (DN)</b> — رسوب مسجّل بدون اختبار. '+
     'حدّث أرقام الغياب في <code>data.js</code> أول بأول.</div><table>'+
     '<tr><th>المادة</th><th>الغياب</th></tr>';
  COURSES.forEach(c=>s+='<tr><td class="mono">'+c.code+'</td><td class="mono">'+(ABSENCE[c.code]||0)+'</td></tr>');
  s+='</table></div>';
  document.getElementById("courses").innerHTML=s;
}

/* ---------- الملخصات ---------- */
function renderNotes(){
  var s='<div class="card"><h2>الملخصات</h2>'+
    '<p style="font-size:.9rem;color:var(--ink2);margin:0">'+
    'مرتّبة حسب المادة ثم الفصل. الأخضر جاهز تفتحه الآن.</p></div>'+
    '<div style="margin-top:14px">';
  LESSONS.forEach(function(c){
    var cc=COURSES.filter(function(x){return x.code===c.code;})[0];
    var col=cc?cc.color:'var(--line)';
    var all=0, ready=0;
    c.chapters.forEach(function(ch){ ch.items.forEach(function(i){
      if(i.s!=='wait'){ all++; if(i.s==='done') ready++; } }); });
    s+='<div class="ncourse" style="border-inline-start:5px solid '+col+'">'+
       '<div class="h"><span class="code">'+c.code+'</span>'+
       '<span class="ar">'+(cc?cc.ar:'')+'</span>'+
       (all?'<span class="cnt">'+ready+' / '+all+' جاهز</span>':'')+'</div>';
    c.chapters.forEach(function(ch){
      s+='<div class="nchap"><div class="ct"><span>'+ch.name+'</span>'+
         (ch.meta?'<span class="cm">'+ch.meta+'</span>':'')+'</div>';
      ch.items.forEach(function(i){
        var lab = i.n ? i.n : (i.s==='wait' ? '—' : '•');
        s+='<div class="nitem'+(i.s==='done'?'':' off')+'">'+
           '<span class="num '+i.s+'">'+lab+'</span><span class="bd">'+
           (i.href?'<a class="t1" href="'+i.href+'">'+i.ar+'</a>'
                  :'<span class="t1">'+i.ar+'</span>')+
           (i.o?'<span class="ob">'+i.o+'</span>':'')+(i.enhref?' <a class="enlink" href="'+i.enhref+'">EN</a>':'')+
           (i.star?'<span class="sr">'+i.star+'</span>':'')+
           (i.en?'<div class="t2">'+i.en+'</div>':'')+
           (i.note?'<div class="nn">'+i.note+'</div>':'')+
           '</span></div>';
      });
      s+='</div>';
    });
    s+='</div>';
  });
  s+='</div>';
  document.getElementById("notes").innerHTML=s;
}


/* ---------- الخريطة ---------- */
function renderMap(){
  var LBL={done:"\u2713",todo:"\u2026",wait:"\u2014",block:"!",ready:"\u25B8"};
  var s='<div class="card"><h2>خريطة المحتوى</h2>'+
    '<p style="font-size:.9rem;color:var(--ink2);margin:0 0 10px">'+
    'وش جاهز، وش تحت الشغل، ووش ينتظر مادة من الدكتور.</p>'+
    '<div class="key">'+
    '<span><span class="st done">\u2713</span>جاهز — افتحه الآن</span>'+
    '<span><span class="st ready">\u25B8</span>المادة موجودة، لم تُشرح</span>'+
    '<span><span class="st todo">\u2026</span>تحت الشغل</span>'+
    '<span><span class="st block">!</span>ناقص — لازم تجيبه</span>'+
    '<span><span class="st wait">\u2014</span>ينتظر الدكتور</span></div></div>';

  s+='<div class="tree" style="margin-top:14px">';
  MAP.forEach(function(c){
    var cc=COURSES.filter(function(x){return x.code===c.code;})[0];
    var col=cc?cc.color:'var(--line)';
    s+='<div class="tcourse" style="border-inline-start:5px solid '+col+'">'+
       '<div class="h"><span class="code">'+c.code+'</span><span>'+c.ar+'</span>'+
       (c.lang!=="—"?'<span style="font-size:.74rem;color:var(--muted)">لغة التدريس: '+c.lang+'</span>':'')+
       (c.priority?'<span class="tag">الأولوية</span>':'')+'</div>'+
       '<div class="book">'+c.book+'</div>';
    c.units.forEach(function(u){
      s+='<div class="tunit">'+u.name+'</div><div class="tnode">';
      u.items.forEach(function(i){
        s+='<div class="titem"><span class="st '+i.s+'">'+LBL[i.s]+'</span><span class="tx">'+
           (i.href?'<a class="tt" href="'+i.href+'">'+i.t+'</a>':'<span class="tt">'+i.t+'</span>')+
           (i.o?'<span class="obj">'+i.o+'</span>':'')+
           (i.note?'<div class="nt">'+i.note+'</div>':'')+'</span></div>';
      });
      s+='</div>';
    });
    s+='</div>';
  });
  s+='</div>';

  s+='<div class="card" style="margin-top:20px"><h2>كيف أشرح لك</h2>'+
    '<p style="font-size:.92rem;color:var(--ink2)">القاعدة الوحيدة: '+
    '<b>العربي يحمل الفهم، والإنجليزي يحمل المصطلح.</b> '+
    'المصطلح الإنجليزي يُترجم <b>مرّة واحدة</b> أول ما يجي، وبعدها يبقى إنجليزياً داخل الجمل العربية '+
    'ولا يُستبدل أبداً.</p>'+
    '<div class="warn">ما أترجم لك الفصل كامل للعربي — أبداً. '+
    'لأنك لو عرفت إن فيه نسخة عربية جاية، بتوقف عن قراءة الإنجليزي أصلاً. '+
    'والامتحان إنجليزي. فالعربي <b>سقالة حول</b> الإنجليزي، مو بديل عنه.</div>'+
    '<p style="font-size:.92rem;margin-top:14px">وكل مفهوم يجيك بنفس الشكل — سبع خانات ثابتة:</p>'+
    '<div class="blocks">'+
      '<div class="brow"><span class="bn">HEADER</span><span class="bd">المصطلح بالإنجليزي + ترجمته مرة واحدة + النطق</span></div>'+
      '<div class="brow"><span class="bn">الفكرة</span><span class="bd">سطر واحد بالعربي، صفر مصطلحات جديدة</span></div>'+
      '<div class="brow"><span class="bn">الشرح</span><span class="bd">بالعربي، والمصطلحات الإنجليزية <b>مضمّنة بالإنجليزي</b></span></div>'+
      '<div class="brow"><span class="bn">مثال</span><span class="bd">من بيئتك — المدينة، جامعة طيبة، الريال</span></div>'+
      '<div class="brow"><span class="bn en">EXAM BOX</span><span class="bd"><b>إنجليزي صافي.</b> صياغة الكتاب حرفياً. هذا اللي بيجيك في الورقة.</span></div>'+
      '<div class="brow"><span class="bn">الفخ</span><span class="bd">الخلط الشائع + الكلمات اللي تجي كمشتتات في الاختيارات</span></div>'+
      '<div class="brow"><span class="bn en">CHECK</span><span class="bd">سؤال MCQ بالإنجليزي + الجواب والتعليل بالعربي</span></div>'+
    '</div>'+
    '<p style="font-size:.92rem;margin-top:6px"><b>ليش الأسئلة إنجليزية؟</b> '+
    'لأنك تُختبر على اللي تتدرّب عليه. لو تدرّبت بالعربي بتحسّ إنك فاهم، '+
    'وبعدين تنهار في الورقة الإنجليزية. فالتدريب بلغة الامتحان — دائماً.</p>'+
    '<p style="font-size:.92rem"><b>والسقالة تقل مع الوقت:</b> '+
    'الأسابيع ١–٤ ترجمة سطر تحت كل سؤال · ٥–٩ قائمة مصطلحات فقط · '+
    '١٠–١٥ إنجليزي بدون مساعدة. الهدف إنك تستغني عني، مو إنك تعتمد عليّ.</p>'+
    '<div class="samp"><b>مثال مصغّر — كيف يطلع الشرح فعلياً:</b><br>'+
    'هيرزبرغ قسّم أسباب الرضا الوظيفي لمجموعتين. الأولى <b>hygiene factors</b> — '+
    'الراتب وظروف العمل — كلها مرتبطة بـ <b>job context</b>. '+
    'إذا كانت سيئة يصير الموظف <b>dissatisfied</b>، وإذا صلّحتها بس يوقف عن التذمر، '+
    'ما يصير <b>motivated</b>.'+
    '<div class="en">Hygiene factors are associated with job context. Their presence does not '+
    'motivate; their absence produces dissatisfaction.</div></div>'+
    '<p style="font-size:.88rem;color:var(--muted);margin-top:12px">'+
    'ملاحظة: <bdi>MKT 231</bdi> تُدرَّس بالعربي حسب دليل المقرر — فما تحتاج هذي الطريقة. '+
    'كل مادة لها لغتها، والطريقة تتغيّر معها.</p>'+
    '</div>';
  document.getElementById("map").innerHTML=s;
}


/* ---------- البطاقات ---------- */
function renderDecks(){
  var D=window.YH_DECKS||{}, ids=Object.keys(D), streak=0;
  try{ var s=JSON.parse(localStorage.getItem('yh-streak')||'{}'); streak=s.n||0; }catch(e){}
  var s='<div class="card"><h2>البطاقات</h2><p style="font-size:.92rem;color:var(--ink2);margin:0 0 12px">'+
    'كل درس له مجموعة بطاقات: كلماته ومفاهيمه. اضغط <b>ابدأ</b>، اقلب البطاقة، وقل إذا عرفتها. '+
    'اللي ما تعرفها ترجع لك أسرع، واللي تعرفها تبعد عنك أكثر — هذا هو التكرار المتباعد.</p>'+
    '<span class="streak">🔥 '+streak+' يوم متواصل</span></div><div class="grid" style="margin-top:14px">';
  if(!ids.length) s+='<div class="card empty">ما فيه بطاقات بعد.</div>';
  ids.forEach(function(id){ var d=D[id], st=window.YH_FLASH?YH_FLASH.stats(d):{total:d.cards.length,due:0,learned:0};
    var vocab=d.cards.filter(function(c){return c.kind==='vocab';}).length, conc=d.cards.length-vocab;
    s+='<div class="deck"><div class="dn">'+d.title+'<small>'+st.total+' بطاقة ('+vocab+' كلمة · '+conc+' مفهوم) · متقنة '+st.learned+'</small></div>'+
       '<span class="st">'+(st.due?'<span class="due">'+st.due+' مستحقة اليوم</span>':'✓ ما فيه مستحق')+'</span>'+
       '<button class="pill gold" data-deck="'+id+'">ابدأ</button>'+
       '<button class="pill" data-deck="'+id+'" data-mode="ar">عربي ← إنجليزي</button></div>'; });
  s+='</div>'; document.getElementById("decks").innerHTML=s;
}

renderToday();renderWeek();renderCal();renderCourses();renderNotes();renderMap();renderDecks();

document.getElementById("nav").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  document.querySelectorAll("#nav button").forEach(x=>x.setAttribute("aria-selected",x===b));
  ["today","week","cal","courses","notes","map","decks"].forEach(id=>
    document.getElementById(id).hidden = (id!==b.dataset.t));
});
</script>
</body>
</html>
